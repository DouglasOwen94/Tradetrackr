<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TradeTrackr — Trade Journal</title>
<meta name="description" content="A lean trading journal. Log trades, track PnL, review your stats.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeTrackr">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg-1:#bad3ec; --bg-2:#89aed6; --bg-3:#dcebf8;
  --navy:#123259; --navy-2:#0e2a4d; --navy-3:#1b3f6e;
  --glass:rgba(255,255,255,.42); --glass-line:rgba(255,255,255,.55);
  --ink:#ecf4fd; --ink-dim:#a7c0e0; --ink-faint:#7d9cc4;
  --ink-dark:#132c4d; --ink-dark-dim:#4a678e;
  --blue:#8fc1f0; --blue-soft:#bcd9f5;
  --green:#3ad98e; --green-deep:#19b873; --red:#ff8484; --red-deep:#f06060;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --nav-h:76px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink-dark);
  background:
    radial-gradient(120% 60% at 85% -5%, var(--bg-3) 0%, transparent 55%),
    radial-gradient(100% 70% at 10% 100%, #7ea6d2 0%, transparent 60%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 100%);
  background-attachment:fixed;
  min-height:100vh; min-height:100dvh;
  overscroll-behavior-y:none;
}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg{display:block;flex:none}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 4px 16px}
.hdr .logo{width:30px;height:26px}
.hdr .brand{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.hdr .spacer{flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(8px)}
.icon-btn svg{width:19px;height:19px;stroke:var(--ink-dark)}

/* ---------- cards ---------- */
.card-navy{background:linear-gradient(160deg,var(--navy-3) 0%,var(--navy-2) 85%);border-radius:var(--r-lg);padding:20px;color:var(--ink);box-shadow:0 18px 40px -18px rgba(9,32,61,.55);margin-bottom:16px}
.card-glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-lg);padding:20px;backdrop-filter:blur(10px);margin-bottom:16px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title h3{font-size:1rem}
.card-navy .card-title h3{color:var(--ink)}
.card-navy .sub{color:var(--ink-dim);font-size:.8rem}

/* ---------- hero ---------- */
.hero{background:linear-gradient(155deg,#6f9dce 0%,#3c6ba3 45%,#173d6c 100%);border-radius:var(--r-lg);padding:22px 20px;color:var(--ink);box-shadow:0 20px 44px -16px rgba(12,40,74,.6);margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 90% 0%,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
.hero .label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.hero .label{font-size:.85rem;color:#d8e8fa;font-weight:500}
.acct-select{position:relative}
.acct-select select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:var(--ink);border-radius:999px;padding:6px 30px 6px 14px;font-size:.8rem;font-weight:600;max-width:170px;text-overflow:ellipsis}
.acct-select svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink);pointer-events:none}
.hero .amount{font-size:2.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;word-break:break-all}
.hero .amount .cents{color:#a9c6e8;font-weight:600}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:.75rem;font-weight:600}
.chip svg{width:13px;height:13px}
.chip.pos{color:#8ff5c4}.chip.pos svg{stroke:#8ff5c4}
.chip.neg{color:#ffb3b3}.chip.neg svg{stroke:#ffb3b3}
.chip.neutral{color:#d8e8fa}.chip.neutral svg{stroke:#d8e8fa}
.hero-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.hero-actions button{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-md);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:.75rem;font-weight:600;transition:background .15s}
.hero-actions button:active{background:rgba(255,255,255,.28)}
.hero-actions svg{width:18px;height:18px;stroke:var(--ink)}

/* ---------- month selector ---------- */
.month-row{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
.month-row .m-label{font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.m-btn{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-line);display:flex;align-items:center;justify-content:center}
.m-btn svg{width:16px;height:16px;stroke:var(--ink-dark)}
.m-btn:disabled{opacity:.35}

/* ---------- stat grid ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-cell{background:linear-gradient(160deg,var(--navy-3),var(--navy-2));border-radius:var(--r-md);padding:16px;color:var(--ink)}
.stat-cell .k{font-size:.72rem;color:var(--ink-dim);font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stat-cell .k svg{width:13px;height:13px;stroke:var(--ink-faint)}
.stat-cell .v{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.v.pos{color:var(--green)}.v.neg{color:var(--red)}
.stat-cell .v small{font-size:.75rem;color:var(--ink-dim);font-weight:500}

/* win/loss bar */
.wl-bar{height:10px;border-radius:99px;overflow:hidden;display:flex;background:rgba(255,255,255,.1);margin:12px 0 10px}
.wl-bar span{height:100%}
.wl-legend{display:flex;gap:14px;flex-wrap:wrap}
.wl-legend .li{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--ink-dim)}
.wl-legend .dot{width:8px;height:8px;border-radius:50%}
.wl-legend b{color:var(--ink);font-weight:700}

/* charts */
.chart-wrap{width:100%}
.chart-wrap svg{width:100%;height:auto}
.empty-chart{color:var(--ink-faint);font-size:.82rem;text-align:center;padding:26px 10px}

/* ---------- forms / add trade ---------- */
.section-label{font-size:.78rem;font-weight:600;color:var(--ink-dark-dim);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.select-chip{padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:.85rem;font-weight:600;color:var(--ink-dark);transition:all .12s}
.select-chip.on{background:var(--navy);color:var(--ink);border-color:var(--navy)}
.select-chip.ghost{border-style:dashed;color:var(--ink-dark-dim);display:inline-flex;align-items:center;gap:5px}
.select-chip.ghost svg{width:14px;height:14px;stroke:var(--ink-dark-dim)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:14px;border-radius:var(--r-md);background:var(--glass);border:1px solid var(--glass-line);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-dark)}
.seg button svg{width:17px;height:17px;stroke:currentColor}
.seg button.buy.on{background:linear-gradient(150deg,#1f9e68,#137a50);color:#fff;border-color:transparent}
.seg button.sell.on{background:linear-gradient(150deg,#e4635f,#c14340);color:#fff;border-color:transparent}
.field{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-md);padding:4px 14px;display:flex;align-items:center;gap:10px}
.field input,.field textarea,.field select{flex:1;background:none;border:0;outline:0;padding:11px 0;font-size:.95rem;color:var(--ink-dark);min-width:0}
.field textarea{resize:vertical;min-height:84px;line-height:1.45}
.field svg{width:17px;height:17px;stroke:var(--ink-dark-dim)}
input::placeholder,textarea::placeholder{color:var(--ink-dark-dim)}

/* pnl calculator */
.calc{background:linear-gradient(160deg,var(--navy-3),var(--navy-2));border-radius:var(--r-lg);padding:18px;color:var(--ink)}
.calc .net-label{font-size:.72rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em}
.calc .net{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.layer{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.layer .idx{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--ink-dim)}
.layer .sign{width:44px;height:44px;border-radius:var(--r-sm);font-weight:800;font-size:1.05rem;border:1px solid rgba(255,255,255,.18)}
.layer .sign.pos{background:rgba(58,217,142,.16);color:var(--green)}
.layer .sign.neg{background:rgba(255,132,132,.16);color:var(--red)}
.layer .amt{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-sm);padding:11px 12px;color:var(--ink);outline:0;font-size:1rem;font-weight:600;min-width:0}
.layer .del{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.layer .del svg{width:16px;height:16px;stroke:var(--ink-faint)}
.add-layer{width:100%;margin-top:4px;padding:12px;border-radius:var(--r-sm);border:1px dashed rgba(255,255,255,.3);color:var(--ink-dim);font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px}
.add-layer svg{width:15px;height:15px;stroke:var(--ink-dim)}

.btn-primary{width:100%;padding:16px;border-radius:var(--r-md);background:linear-gradient(150deg,var(--navy-3),var(--navy-2));color:var(--ink);font-weight:700;font-size:1rem;box-shadow:0 14px 30px -12px rgba(9,32,61,.6);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px}
.btn-primary svg{width:17px;height:17px;stroke:var(--ink)}
.btn-primary:disabled{opacity:.5}
.btn-danger-ghost{width:100%;padding:13px;border-radius:var(--r-md);color:var(--red-deep);font-weight:600;font-size:.9rem;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-danger-ghost svg{width:16px;height:16px;stroke:var(--red-deep)}

/* ---------- history ---------- */
.day-head{font-size:.75rem;font-weight:700;color:var(--ink-dark-dim);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px;display:flex;justify-content:space-between}
.trade-row{width:100%;text-align:left;background:linear-gradient(160deg,var(--navy-3),var(--navy-2));border-radius:var(--r-md);padding:14px 16px;color:var(--ink);display:flex;align-items:center;gap:12px;margin-bottom:8px}
.trade-row .ava{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;letter-spacing:.02em;flex:none}
.trade-row .mid{flex:1;min-width:0}
.trade-row .sym{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:7px}
.dir-badge{font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
.dir-badge.buy{background:rgba(58,217,142,.18);color:var(--green)}
.dir-badge.sell{background:rgba(255,132,132,.18);color:var(--red)}
.trade-row .meta{font-size:.72rem;color:var(--ink-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trade-row .pnl{font-weight:700;font-size:.95rem;text-align:right}
.trade-row .pnl.pos{color:var(--green)}.trade-row .pnl.neg{color:var(--red)}.trade-row .pnl.be{color:var(--ink-dim)}
.trade-row .pnl small{display:block;font-size:.65rem;color:var(--ink-faint);font-weight:500;margin-top:2px}
.trade-row > svg{width:16px;height:16px;stroke:var(--ink-faint)}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;margin-bottom:4px}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-scroll .select-chip{white-space:nowrap}
.empty-state{text-align:center;padding:56px 20px;color:var(--ink-dark-dim)}
.empty-state svg{width:44px;height:44px;stroke:var(--ink-dark-dim);margin:0 auto 14px}
.empty-state p{font-size:.9rem;line-height:1.5}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(19,44,77,.1)}
.set-row:last-child{border-bottom:0}
.set-row .grow{flex:1;min-width:0}
.set-row .t{font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:8px}
.set-row .s{font-size:.76rem;color:var(--ink-dark-dim);margin-top:2px}
.badge{font-size:.6rem;font-weight:800;background:var(--navy);color:var(--ink);border-radius:6px;padding:2px 7px;letter-spacing:.05em}
.mini-btn{width:34px;height:34px;border-radius:50%;background:rgba(19,44,77,.08);display:flex;align-items:center;justify-content:center}
.mini-btn svg{width:15px;height:15px;stroke:var(--ink-dark)}
.mini-btn.danger svg{stroke:var(--red-deep)}
.asset-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(19,44,77,.08);border-radius:999px;padding:7px 8px 7px 14px;font-size:.82rem;font-weight:600;margin:0 8px 8px 0}
.asset-tag.def{background:var(--navy);color:var(--ink)}
.asset-tag button{display:flex}
.asset-tag svg{width:13px;height:13px;stroke:currentColor;opacity:.6}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-soft{padding:13px;border-radius:var(--r-md);background:rgba(19,44,77,.08);font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink-dark)}
.btn-soft svg{width:16px;height:16px;stroke:var(--ink-dark)}

/* ---------- bottom nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.nav-inner{pointer-events:auto;width:100%;max-width:480px;margin:0 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(160deg,rgba(23,52,90,.96),rgba(13,38,70,.96));backdrop-filter:blur(14px);border-radius:28px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:10px 6px;box-shadow:0 18px 40px -12px rgba(8,28,55,.65)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--ink-faint);font-size:.62rem;font-weight:600}
.nav-item svg{width:21px;height:21px;stroke:currentColor}
.nav-item.on{color:var(--ink)}
.nav-add{display:flex;align-items:center;justify-content:center}
.nav-add button{width:54px;height:54px;border-radius:50%;background:linear-gradient(150deg,#9cc6ef,#5f92c9);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -6px rgba(20,55,100,.6);transform:translateY(-14px)}
.nav-add svg{width:24px;height:24px;stroke:#0e2a4d;stroke-width:2.4}

/* ---------- sheet / modal ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,28,52,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;background:linear-gradient(170deg,#e9f2fb,#cfe2f4);border-radius:26px 26px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .2s}
.sheet-backdrop.open .sheet{transform:translateY(0)}
.sheet h3{font-size:1.1rem;margin-bottom:4px}
.sheet .desc{font-size:.82rem;color:var(--ink-dark-dim);margin-bottom:16px;line-height:1.45}
.sheet .field{background:#fff;border-color:rgba(19,44,77,.12);margin-bottom:12px}
.sheet .seg{margin-bottom:12px}
.sheet .seg button{background:#fff;border-color:rgba(19,44,77,.12)}
.grab{width:40px;height:4px;border-radius:99px;background:rgba(19,44,77,.2);margin:0 auto 16px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(8px);background:var(--navy-2);color:var(--ink);padding:11px 20px;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;transition:all .2s;z-index:80;pointer-events:none;box-shadow:0 10px 26px -8px rgba(8,28,55,.6);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 32 26" fill="#132c4d"><rect x="6" y="0" width="20" height="4" rx="1"/><rect x="2" y="7" width="24" height="5" rx="1"/><rect x="0" y="15" width="28" height="6" rx="1"/><rect x="20" y="9" width="10" height="2" rx="1" opacity=".7"/></svg>
    <span class="brand">TradeTrackr</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-export-top" aria-label="Export backup" title="Export backup">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </header>

  <!-- ============ STATS ============ -->
  <section class="view" id="view-stats"></section>

  <!-- ============ ADD / EDIT TRADE ============ -->
  <section class="view" id="view-add"></section>

  <!-- ============ HISTORY ============ -->
  <section class="view" id="view-history"></section>

  <!-- ============ SETTINGS ============ -->
  <section class="view" id="view-settings"></section>
</div>

<nav>
  <div class="nav-inner">
    <button class="nav-item" data-nav="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>
      <span>Stats</span>
    </button>
    <button class="nav-item" data-nav="history">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      <span>History</span>
    </button>
    <div class="nav-add">
      <button data-nav="add" aria-label="Add trade">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <button class="nav-item" id="nav-backup">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Backup</span>
    </button>
    <button class="nav-item" data-nav="settings">

<script>
/* ============================================================
   TradeTrackr — lean trading journal (local-first PWA)
   ============================================================ */
const LS_KEY = 'tradetrackr_v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFAULT_ASSETS = ['XAUUSD','EURUSD','GBPUSD','US30','NAS100','BTCUSD'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_S = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.accounts)){ d.settings = d.settings||{}; if(d.settings.beThreshold==null) d.settings.beThreshold = 0; return d; } }
  }catch(e){}
  return { accounts:[], assets:[...DEFAULT_ASSETS], trades:[], txns:[], settings:{ defaultAccountId:null, defaultAsset:'XAUUSD', beThreshold:0 } };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast('Could not save — storage full'); } }

/* ---------- ui state ---------- */
const now = new Date();
let UI = {
  tab:'stats',
  statsAccountId:null,
  statsY: now.getFullYear(), statsM: now.getMonth(),
  historyFilter:'all',
  form:null // add/edit trade form state
};

/* ---------- helpers ---------- */
const acct = id => S.accounts.find(a=>a.id===id);
const defAcct = () => acct(S.settings.defaultAccountId) || S.accounts[0] || null;
function money(n, sign){
  const neg = n < 0; const abs = Math.abs(n);
  const str = abs.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg ? '-' : (sign && n > 0 ? '+' : '')) + '$' + str;
}
function moneyParts(n){
  const neg = n < 0; const abs = Math.abs(n);
  const [w, c] = abs.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}).split('.');
  return { main:(neg?'-':'') + '$' + w, cents:'.' + c };
}
const tradePnl = t => t.layers.reduce((s,x)=>s+x,0);
function balance(accountId, uptoDate){
  const a = acct(accountId); if(!a) return 0;
  let b = a.startingBalance || 0;
  for(const t of S.trades) if(t.accountId===accountId && (!uptoDate || t.date <= uptoDate)) b += tradePnl(t);
  for(const x of S.txns) if(x.accountId===accountId && (!uptoDate || x.date <= uptoDate)) b += x.amount;
  return b;
}
const inMonth = (dateStr,y,m) => { const [Y,M] = dateStr.split('-').map(Number); return Y===y && M-1===m; };
function monthTrades(accountId,y,m){ return S.trades.filter(t=>t.accountId===accountId && inMonth(t.date,y,m)); }
function classify(t){ const p = tradePnl(t); const thr = Math.abs(S.settings.beThreshold||0); return p>thr?'win':p<-thr?'loss':'be'; }
function fmtDateShort(d){ const [y,m,dd]=d.split('-'); return Number(dd)+' '+MONTHS_S[m-1].charAt(0)+MONTHS_S[m-1].slice(1).toLowerCase()+' '+y; }
function relDay(d){
  const t = todayISO();
  if(d===t) return 'Today';
  const y = new Date(); y.setDate(y.getDate()-1);
  const yISO = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(d===yISO) return 'Yesterday';
  return fmtDateShort(d);
}

/* ---------- icons ---------- */
const I = {
  up:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 15 10 9 14 13 20 7"/><polyline points="14 7 20 7 20 13"/></svg>',

  minus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  chevD:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  ul:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  hash:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>',
  scale:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7l7-4 7 4"/><path d="M2 13l3-6 3 6a3 3 0 0 1-6 0Z"/><path d="M16 13l3-6 3 6a3 3 0 0 1-6 0Z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/></svg>'
};

/* ============================================================
   RENDER: STATS
   ============================================================ */
function renderStats(){
  const el = document.getElementById('view-stats');
  if(!S.accounts.length){ el.innerHTML = emptyOnboard(); return; }
  if(!UI.statsAccountId || !acct(UI.statsAccountId)) UI.statsAccountId = defAcct().id;
  const aid = UI.statsAccountId;
  const bal = balance(aid);
  const y = UI.statsY, m = UI.statsM;
  const mt = monthTrades(aid, y, m);
  const wins = mt.filter(t=>classify(t)==='win');
  const losses = mt.filter(t=>classify(t)==='loss');
  const bes = mt.filter(t=>classify(t)==='be');
  const monthPnl = mt.reduce((s,t)=>s+tradePnl(t),0);
  const decided = wins.length + losses.length;
  const winrate = decided ? (wins.length/decided*100) : null;
  const grossW = wins.reduce((s,t)=>s+tradePnl(t),0);
  const grossL = Math.abs(losses.reduce((s,t)=>s+tradePnl(t),0));
  const pf = grossL > 0 ? (grossW/grossL) : (grossW > 0 ? Infinity : null);
  const todayPnl = S.trades.filter(t=>t.accountId===aid && t.date===todayISO()).reduce((s,t)=>s+tradePnl(t),0);
  const isCurrent = y===now.getFullYear() && m===now.getMonth();
  const bp = moneyParts(bal);
  const startBal = acct(aid).startingBalance || 0;
  const pctBase = (bal - monthPnl);
  const monthPct = pctBase !== 0 ? (monthPnl/Math.abs(pctBase)*100) : null;

  el.innerHTML = `
  <div class="hero">
    <div class="label-row">
      <span class="label">Account balance</span>
      <div class="acct-select">
        <select id="stats-acct" aria-label="Select account">
          ${S.accounts.map(a=>`<option value="${a.id}" ${a.id===aid?'selected':''}>${esc(a.name)}</option>`).join('')}
        </select>
        ${I.chevD}
      </div>
    </div>
    <div class="amount">${bp.main}<span class="cents">${bp.cents}</span></div>
    <div class="chip-row">
      <span class="chip ${monthPnl>0?'pos':monthPnl<0?'neg':'neutral'}">${monthPnl>=0?I.up:I.down}${monthPct===null?'—':(monthPnl>=0?'+':'')+monthPct.toFixed(2)+'%'} · ${MONTHS_S[m]}</span>
      <span class="chip ${todayPnl>0?'pos':todayPnl<0?'neg':'neutral'}">${money(todayPnl,true)} · Today</span>
    </div>
    <div class="hero-actions">
      <button data-act="go-add">${I.plus}<span>Add trade</span></button>
      <button data-act="deposit">${I.dl}<span>Deposit</span></button>
      <button data-act="withdraw">${I.ul}<span>Withdraw</span></button>
    </div>
  </div>

  <div class="month-row">
    <button class="m-btn" id="m-prev" aria-label="Previous month">${I.chevL}</button>
    <span class="m-label">${MONTHS[m]} ${y}</span>
    <button class="m-btn" id="m-next" aria-label="Next month" ${isCurrent?'disabled':''}>${I.chevR}</button>
  </div>

  <div class="stat-grid">
    <div class="stat-cell"><div class="k">${I.wallet}Monthly PnL</div><div class="v ${monthPnl>0?'pos':monthPnl<0?'neg':''}">${money(monthPnl,true)}</div></div>
    <div class="stat-cell"><div class="k">${I.target}Winrate</div><div class="v">${winrate===null?'—':winrate.toFixed(1)+'%'}</div></div>
    <div class="stat-cell"><div class="k">${I.hash}Trades this month</div><div class="v">${mt.length}</div></div>
    <div class="stat-cell"><div class="k">${I.scale}Profit factor</div><div class="v">${pf===null?'—':pf===Infinity?'∞':pf.toFixed(2)}</div></div>
  </div>

  <div class="card-navy">
    <div class="card-title"><h3>Wins vs losses</h3><span class="sub">${MONTHS_S[m]} ${y}</span></div>
    ${mt.length ? `
    <div class="wl-bar">
      <span style="width:${(wins.length/mt.length*100)}%;background:var(--green)"></span>
      <span style="width:${(bes.length/mt.length*100)}%;background:var(--blue-soft)"></span>
      <span style="width:${(losses.length/mt.length*100)}%;background:var(--red)"></span>
    </div>
    <div class="wl-legend">
      <span class="li"><span class="dot" style="background:var(--green)"></span><b>${wins.length}</b>&nbsp;Wins</span>
      <span class="li"><span class="dot" style="background:var(--red)"></span><b>${losses.length}</b>&nbsp;Losses</span>
      <span class="li"><span class="dot" style="background:var(--blue-soft)"></span><b>${bes.length}</b>&nbsp;Breakeven</span>
    </div>` : `<div class="empty-chart">No trades logged this month yet.</div>`}
  </div>

  <div class="card-navy">
    <div class="card-title"><h3>Equity curve</h3><span class="sub">All time</span></div>
    <div class="chart-wrap">${equitySVG(aid)}</div>
  </div>

  <div class="card-navy">
    <div class="card-title"><h3>Monthly PnL</h3><span class="sub">Last 6 months</span></div>
    <div class="chart-wrap">${monthlyBarsSVG(aid, y, m)}</div>
  </div>`;

  el.querySelector('#stats-acct').onchange = e => { UI.statsAccountId = e.target.value; renderStats(); };
  el.querySelector('#m-prev').onclick = () => { UI.statsM--; if(UI.statsM<0){UI.statsM=11;UI.statsY--;} renderStats(); };
  const nx = el.querySelector('#m-next'); if(nx) nx.onclick = () => { UI.statsM++; if(UI.statsM>11){UI.statsM=0;UI.statsY++;} renderStats(); };
  el.querySelector('[data-act="go-add"]').onclick = () => nav('add');
  el.querySelector('[data-act="deposit"]').onclick = () => openTxnSheet(aid,'deposit');
  el.querySelector('[data-act="withdraw"]').onclick = () => openTxnSheet(aid,'withdraw');
}

function emptyOnboard(){
  return `
  <div class="card-navy" style="text-align:center;padding:40px 24px">
    <div style="display:flex;justify-content:center;margin-bottom:16px"><span style="width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center">${I.wallet.replace('<svg','<svg style="width:26px;height:26px;stroke:var(--blue-soft)"')}</span></div>
    <h3 style="margin-bottom:8px">Welcome to TradeTrackr</h3>
    <p style="color:var(--ink-dim);font-size:.85rem;line-height:1.5;margin-bottom:20px">Create your first trading account to start journaling. Set a name and a starting balance.</p>
    <button class="btn-primary" style="margin-top:0" onclick="openAccountSheet()">${I.plus}Create account</button>
  </div>`;
}

/* ---------- charts (inline SVG, no libs) ---------- */
function equitySVG(aid){
  const a = acct(aid);
  const events = [
    ...S.trades.filter(t=>t.accountId===aid).map(t=>({date:t.date, ts:t.createdAt||0, amt:tradePnl(t)})),
    ...S.txns.filter(x=>x.accountId===aid).map(x=>({date:x.date, ts:x.createdAt||0, amt:x.amount}))
  ].sort((p,q)=> p.date===q.date ? p.ts-q.ts : (p.date<q.date?-1:1));
  let bal = a.startingBalance || 0;
  const pts = [bal];
  for(const e of events){ bal += e.amt; pts.push(bal); }
  if(pts.length < 2) return `<div class="empty-chart">Your equity curve appears after your first trade.</div>`;
  const W=320,H=140,P=8;
  const min = Math.min(...pts), max = Math.max(...pts);
  const span = (max-min) || 1;
  const X = i => P + i*(W-2*P)/(pts.length-1);
  const Y = v => H-P - (v-min)*(H-2*P)/span;
  let d = `M ${X(0)} ${Y(pts[0])}`;
  for(let i=1;i<pts.length;i++) d += ` L ${X(i).toFixed(1)} ${Y(pts[i]).toFixed(1)}`;
  const last = pts[pts.length-1], up = last >= pts[0];
  const col = up ? 'var(--green)' : 'var(--red)';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Equity curve">
    <defs><linearGradient id="eq-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${up?'#3ad98e':'#ff8484'}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${up?'#3ad98e':'#ff8484'}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L ${X(pts.length-1)} ${H-P} L ${X(0)} ${H-P} Z" fill="url(#eq-g)"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last)}" r="3.6" fill="${col}"/>
  </svg>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:.7rem;color:var(--ink-faint)">
    <span>Start ${money(pts[0])}</span><span style="color:${up?'var(--green)':'var(--red)'};font-weight:700">Now ${money(last)}</span>
  </div>`;
}

function monthlyBarsSVG(aid, y, m){
  const buckets = [];
  for(let i=5;i>=0;i--){
    let mm = m-i, yy = y;
    while(mm<0){ mm+=12; yy--; }
    const pnl = monthTrades(aid,yy,mm).reduce((s,t)=>s+tradePnl(t),0);
    buckets.push({label:MONTHS_S[mm], pnl});
  }
  if(buckets.every(b=>b.pnl===0)) return `<div class="empty-chart">No PnL recorded in the last 6 months.</div>`;
  const W=320,H=150,padT=10,padB=22;
  const maxAbs = Math.max(...buckets.map(b=>Math.abs(b.pnl))) || 1;
  const zero = padT + (H-padT-padB)/2;
  const scale = (H-padT-padB)/2 / maxAbs;
  const bw = 26, gap = (W - buckets.length*bw)/(buckets.length+1);
  let bars='', labels='';
  buckets.forEach((b,i)=>{
    const x = gap + i*(bw+gap);
    const h = Math.max(Math.abs(b.pnl)*scale, b.pnl!==0?3:0);
    const yPos = b.pnl>=0 ? zero-h : zero;
    const col = b.pnl>0?'#3ad98e':b.pnl<0?'#ff8484':'rgba(255,255,255,.12)';
    if(b.pnl===0) bars += `<rect x="${x}" y="${zero-1.5}" width="${bw}" height="3" rx="1.5" fill="rgba(255,255,255,.12)"/>`;
    else bars += `<rect x="${x}" y="${yPos.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="5" fill="${col}"/>`;
    labels += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="#7d9cc4" font-weight="600">${b.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" aria-label="Monthly PnL bars">
    <line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 4"/>
    ${bars}${labels}
  </svg>`;
}

function blankForm(){
  const d = defAcct();
  return { editingId:null, accountId: d ? d.id : null, asset: S.settings.defaultAsset || S.assets[0] || null,
           direction:'buy', layers:[{sign:1, val:''}], notes:'', date: todayISO() };

function renderAdd(){
  const el = document.getElementById('view-add');
  if(!S.accounts.length){ el.innerHTML = emptyOnboard(); return; }
  if(!UI.form) UI.form = blankForm();
  const f = UI.form;
  if(!acct(f.accountId)) f.accountId = defAcct().id;
  const net = f.layers.reduce((s,l)=> s + (l.sign * (parseFloat(l.val)||0)), 0);
  const editing = !!f.editingId;

  el.innerHTML = `
  <h2 style="font-size:1.3rem;margin:4px 2px 6px">${editing?'Edit trade':'Add trade'}</h2>
  <p style="font-size:.82rem;color:var(--ink-dark-dim);margin:0 2px">${editing?'Update the details below.':'Log the result — quick and clean.'}</p>

  <div class="section-label">Account</div>
  <div class="chips" id="f-accounts">
    ${S.accounts.map(a=>`<button class="select-chip ${a.id===f.accountId?'on':''}" data-id="${a.id}">${esc(a.name)}${a.id===S.settings.defaultAccountId?' ·':''}</button>`).join('')}
  </div>

  <div class="section-label">Asset</div>
  <div class="chips" id="f-assets">
    ${S.assets.map(s=>`<button class="select-chip ${s===f.asset?'on':''}" data-sym="${esc(s)}">${esc(s)}</button>`).join('')}
    <button class="select-chip ghost" id="f-new-asset">${I.plus}New</button>
  </div>

  <div class="section-label">Direction</div>
  <div class="seg">
    <button class="buy ${f.direction==='buy'?'on':''}" data-dir="buy">${I.up}Buy</button>
    <button class="sell ${f.direction==='sell'?'on':''}" data-dir="sell">${I.down}Sell</button>
  </div>

  <div class="section-label">PnL calculator</div>
  <div class="calc">
    <div class="net-label">Net PnL — all layers</div>
    <div class="net" style="color:${net>0?'var(--green)':net<0?'var(--red)':'var(--ink)'}">${money(net,true)}</div>
    <div id="f-layers">
      ${f.layers.map((l,i)=>`
      <div class="layer" data-i="${i}">
        <span class="idx">${i+1}</span>
        <button class="sign ${l.sign>0?'pos':'neg'}" data-act="sign" aria-label="Toggle profit or loss">${l.sign>0?'+':'−'}</button>
        <input class="amt" type="text" inputmode="decimal" placeholder="0.00" value="${esc(l.val)}" aria-label="Layer ${i+1} amount">
        <button class="del" data-act="del-layer" aria-label="Remove layer" ${f.layers.length===1?'style="visibility:hidden"':''}>${I.x}</button>
      </div>`).join('')}
    </div>
    <button class="add-layer" id="f-add-layer">${I.plus}Add layer</button>
  </div>

  <div class="section-label">Date</div>
  <div class="field">${I.cal}<input type="date" id="f-date" value="${f.date}" max="${todayISO()}"></div>

  <div class="section-label">Notes</div>
  <div class="field">${I.note}<textarea id="f-notes" placeholder="Setup, reasoning, what you'd do differently…">${esc(f.notes)}</textarea></div>

  <button class="btn-primary" id="f-save">${I.check}${editing?'Save changes':'Save trade'}</button>
  ${editing?`<button class="btn-danger-ghost" id="f-delete">${I.trash}Delete trade</button>`:''}`;

  /* wire */
  el.querySelector('#f-accounts').onclick = e => { const b=e.target.closest('[data-id]'); if(b){ f.accountId=b.dataset.id; renderAdd(); } };
  el.querySelector('#f-assets').onclick = e => {
    const b=e.target.closest('[data-sym]'); if(b){ f.asset=b.dataset.sym; renderAdd(); return; }
    if(e.target.closest('#f-new-asset')) openAssetSheet(sym => { f.asset=sym; renderAdd(); });
  };
  el.querySelectorAll('[data-dir]').forEach(b=> b.onclick = ()=>{ f.direction=b.dataset.dir; renderAdd(); });
  const layersEl = el.querySelector('#f-layers');
  layersEl.addEventListener('click', e=>{
    const row = e.target.closest('.layer'); if(!row) return;
    const i = +row.dataset.i;
    if(e.target.closest('[data-act="sign"]')){ f.layers[i].sign *= -1; renderAdd(); }
    if(e.target.closest('[data-act="del-layer"]')){ f.layers.splice(i,1); renderAdd(); }
  });
  layersEl.addEventListener('input', e=>{
    const row = e.target.closest('.layer'); if(!row || !e.target.classList.contains('amt')) return;
    const i = +row.dataset.i;
    e.target.value = e.target.value.replace(/[^0-9.]/g,'');
    f.layers[i].val = e.target.value;
    const n = f.layers.reduce((s,l)=> s + (l.sign*(parseFloat(l.val)||0)), 0);
    const netEl = el.querySelector('.net');
    netEl.textContent = money(n,true);
    netEl.style.color = n>0?'var(--green)':n<0?'var(--red)':'var(--ink)';
  });
  el.querySelector('#f-add-layer').onclick = ()=>{ f.layers.push({sign:1,val:''}); renderAdd(); setTimeout(()=>{ const inputs=el.querySelectorAll('.amt'); inputs[inputs.length-1].focus(); },0); };
  el.querySelector('#f-date').onchange = e=> f.date = e.target.value || todayISO();
  el.querySelector('#f-notes').oninput = e=> f.notes = e.target.value;
  el.querySelector('#f-save').onclick = saveTrade;
  const delBtn = el.querySelector('#f-delete');
  if(delBtn) delBtn.onclick = ()=> confirmSheet('Delete this trade?','This removes it from your journal and stats. This can\'t be undone.',()=>{
    S.trades = S.trades.filter(t=>t.id!==f.editingId); save(); UI.form=null; toast('Trade deleted'); nav('history');
  });
}
function saveTrade(){
  const f = UI.form;
  if(!f.accountId) return toast('Pick an account');
  if(!f.asset) return toast('Pick an asset');
  const layers = f.layers.map(l=> l.sign*(parseFloat(l.val)||0)).filter((v,i)=> f.layers[i].val !== '');
  if(!layers.length) return toast('Enter at least one PnL layer');
  const trade = {
    id: f.editingId || uid(),
    accountId: f.accountId, asset: f.asset, direction: f.direction,
    layers, notes: f.notes.trim(), date: f.date || todayISO(),
    createdAt: f.editingId ? (S.trades.find(t=>t.id===f.editingId)?.createdAt || Date.now()) : Date.now()
  };
  if(f.editingId){ const i = S.trades.findIndex(t=>t.id===f.editingId); S.trades[i] = trade; toast('Trade updated'); }
  else { S.trades.push(trade); toast('Trade saved · ' + money(tradePnl(trade),true)); }
  save(); UI.form = null; nav('history');
}

/* ============================================================
   RENDER: HISTORY
   ============================================================ */
function renderHistory(){
  const el = document.getElementById('view-history');
  if(!S.accounts.length){ el.innerHTML = emptyOnboard(); return; }
  const fid = UI.historyFilter;
  let trades = [...S.trades].sort((a,b)=> a.date===b.date ? (b.createdAt-a.createdAt) : (a.date<b.date?1:-1));
  if(fid!=='all') trades = trades.filter(t=>t.accountId===fid);

  let listHtml = '';
  if(!trades.length){
    listHtml = `<div class="empty-state">${I.book}<p><b>No trades yet.</b><br>Tap the + button to log your first trade.</p></div>`;
  } else {
    let curDay = null;
    for(const t of trades){
      if(t.date !== curDay){
        curDay = t.date;
        const dayTrades = trades.filter(x=>x.date===curDay);
        const dayPnl = dayTrades.reduce((s,x)=>s+tradePnl(x),0);
        listHtml += `<div class="day-head"><span>${relDay(curDay)}</span><span style="color:${dayPnl>0?'var(--green-deep)':dayPnl<0?'var(--red-deep)':'inherit'}">${money(dayPnl,true)}</span></div>`;
      }
      const p = tradePnl(t); const a = acct(t.accountId);
      const kind = classify(t);
      const cls = kind==='win'?'pos':kind==='loss'?'neg':'be';
      listHtml += `
      <button class="trade-row" data-id="${t.id}">
        <span class="ava">${esc(t.asset.slice(0,3))}</span>
        <span class="mid">
          <span class="sym">${esc(t.asset)}<span class="dir-badge ${t.direction}">${t.direction.toUpperCase()}</span></span>
          <span class="meta">${esc(a?a.name:'Deleted account')}${t.layers.length>1?' · '+t.layers.length+' layers':''}${t.notes?' · '+esc(t.notes):''}</span>
        </span>
        <span class="pnl ${cls}">${kind==='be'?'BE':money(p,true)}${kind==='be'?'<small>'+money(p,true)+'</small>':''}</span>
        ${I.chevR}
      </button>`;
    }
  }

  el.innerHTML = `
  <h2 style="font-size:1.3rem;margin:4px 2px 14px">History</h2>
  <div class="filter-scroll">
    <button class="select-chip ${fid==='all'?'on':''}" data-f="all">All accounts</button>
    ${S.accounts.map(a=>`<button class="select-chip ${fid===a.id?'on':''}" data-f="${a.id}">${esc(a.name)}</button>`).join('')}
  </div>
  ${listHtml}`;

  el.querySelector('.filter-scroll').onclick = e=>{ const b=e.target.closest('[data-f]'); if(b){ UI.historyFilter=b.dataset.f; renderHistory(); } };
  el.querySelectorAll('.trade-row').forEach(r=> r.onclick = ()=>{
    const t = S.trades.find(x=>x.id===r.dataset.id); if(!t) return;
    UI.form = { editingId:t.id, accountId:t.accountId, asset:t.asset, direction:t.direction,
      layers: t.layers.map(v=>({sign: v<0?-1:1, val: String(Math.abs(v))})), notes:t.notes, date:t.date };
    nav('add');
  });
}

/* ============================================================
   RENDER: SETTINGS
   ============================================================ */
function renderSettings(){
  const el = document.getElementById('view-settings');
  el.innerHTML = `
  <h2 style="font-size:1.3rem;margin:4px 2px 14px">Settings</h2>

  <div class="card-glass">
    <div class="card-title"><h3>Accounts</h3><button class="mini-btn" id="s-add-acct" aria-label="Add account">${I.plus}</button></div>
    ${S.accounts.length ? S.accounts.map(a=>`
    <div class="set-row">
      <div class="grow">
        <div class="t">${esc(a.name)} ${a.id===S.settings.defaultAccountId?'<span class="badge">DEFAULT</span>':''}</div>
        <div class="s">Balance ${money(balance(a.id))} · Started ${money(a.startingBalance||0)}</div>
      </div>
      ${a.id!==S.settings.defaultAccountId?`<button class="mini-btn" data-act="def" data-id="${a.id}" aria-label="Set as default" title="Set as default">${I.star}</button>`:''}
      <button class="mini-btn" data-act="edit" data-id="${a.id}" aria-label="Edit account">${I.pencil}</button>
      <button class="mini-btn danger" data-act="del" data-id="${a.id}" aria-label="Delete account">${I.trash}</button>
    </div>`).join('') : '<p style="font-size:.85rem;color:var(--ink-dark-dim)">No accounts yet.</p>'}
  </div>

  <div class="card-glass">
    <div class="card-title"><h3>Assets</h3></div>
    <p style="font-size:.78rem;color:var(--ink-dark-dim);margin-bottom:12px">Tap an asset to make it the default. It'll be pre-selected when you add a trade.</p>
    <div>
      ${S.assets.map(s=>`
      <span class="asset-tag ${s===S.settings.defaultAsset?'def':''}" data-sym="${esc(s)}">
        <button data-act="set-def" style="font:inherit;color:inherit">${esc(s)}</button>
        <button data-act="rm" aria-label="Remove ${esc(s)}">${I.x}</button>
      </span>`).join('')}
      <span class="asset-tag" style="background:transparent;border:1px dashed rgba(19,44,77,.3)"><button data-act="add-asset" style="display:flex;align-items:center;gap:6px;font:inherit;color:var(--ink-dark-dim)">${I.plus}Add</button></span>
    </div>
  </div>

  <div class="card-glass">
    <div class="card-title"><h3>Preferences</h3></div>
    <p style="font-size:.78rem;color:var(--ink-dark-dim);margin-bottom:12px">Breakeven threshold — trades with net PnL between <b>−$<span id="be-echo">${(S.settings.beThreshold||0)}</span></b> and <b>+$<span id="be-echo2">${(S.settings.beThreshold||0)}</span></b> count as breakeven and are excluded from your winrate.</p>
    <div class="field" style="background:#fff;border-color:rgba(19,44,77,.12)">
      <span style="font-weight:700;color:var(--ink-dark-dim)">±$</span>
      <input id="s-be" type="text" inputmode="decimal" value="${S.settings.beThreshold||0}" aria-label="Breakeven threshold">
    </div>
  </div>

  <div class="card-glass">
    <div class="card-title"><h3>Data</h3></div>
    <p style="font-size:.78rem;color:var(--ink-dark-dim);margin-bottom:12px">Your journal lives on this device. Export a backup regularly — restore it here or on another phone.</p>
    <div class="row-btns">
      <button class="btn-soft" id="s-export">${I.dl}Export backup</button>
      <button class="btn-soft" id="s-import">${I.ul}Import backup</button>
    </div>
    <button class="btn-danger-ghost" id="s-reset" style="margin-top:14px">${I.trash}Erase all data</button>
  </div>`;

  el.querySelector('#s-add-acct').onclick = ()=> openAccountSheet();
  el.querySelectorAll('[data-act="def"]').forEach(b=> b.onclick = ()=>{ S.settings.defaultAccountId=b.dataset.id; save(); toast('Default account set'); renderSettings(); });
  el.querySelectorAll('[data-act="edit"]').forEach(b=> b.onclick = ()=> openAccountSheet(b.dataset.id));
  el.querySelectorAll('[data-act="del"]').forEach(b=> b.onclick = ()=>{
    const a = acct(b.dataset.id);
    const n = S.trades.filter(t=>t.accountId===a.id).length;
    confirmSheet(`Delete "${a.name}"?`, `This also deletes its ${n} trade${n===1?'':'s'} and all deposits/withdrawals. This can't be undone.`, ()=>{
      S.accounts = S.accounts.filter(x=>x.id!==a.id);
      S.trades = S.trades.filter(t=>t.accountId!==a.id);
      S.txns = S.txns.filter(t=>t.accountId!==a.id);
      if(S.settings.defaultAccountId===a.id) S.settings.defaultAccountId = S.accounts[0]?.id || null;
      if(UI.statsAccountId===a.id) UI.statsAccountId = null;
      if(UI.historyFilter===a.id) UI.historyFilter='all';
      save(); toast('Account deleted'); renderSettings();
    });
  });
  el.querySelectorAll('.asset-tag[data-sym]').forEach(tag=>{
    tag.querySelector('[data-act="set-def"]').onclick = ()=>{ S.settings.defaultAsset = tag.dataset.sym; save(); toast(tag.dataset.sym+' is now default'); renderSettings(); };
    tag.querySelector('[data-act="rm"]').onclick = ()=>{
      S.assets = S.assets.filter(s=>s!==tag.dataset.sym);
      if(S.settings.defaultAsset===tag.dataset.sym) S.settings.defaultAsset = S.assets[0] || null;
      save(); renderSettings();
    };
  });
  el.querySelector('[data-act="add-asset"]').onclick = ()=> openAssetSheet(()=> renderSettings());
  const beIn = el.querySelector('#s-be');
  beIn.addEventListener('input', e=>{
    e.target.value = e.target.value.replace(/[^0-9.]/g,'');
    const v = parseFloat(e.target.value)||0;
    el.querySelector('#be-echo').textContent = v;
    el.querySelector('#be-echo2').textContent = v;
  });
  beIn.addEventListener('change', e=>{
    S.settings.beThreshold = parseFloat(e.target.value)||0;
    save(); toast('Breakeven threshold: ±' + money(S.settings.beThreshold));
  });
  el.querySelector('#s-export').onclick = exportData;
  el.querySelector('#s-import').onclick = ()=> document.getElementById('import-file').click();
  el.querySelector('#s-reset').onclick = ()=> confirmSheet('Erase all data?','Every account, trade, and note will be permanently deleted from this device.',()=>{
    localStorage.removeItem(LS_KEY); S = load(); UI = {tab:'stats',statsAccountId:null,statsY:now.getFullYear(),statsM:now.getMonth(),historyFilter:'all',form:null};
    toast('All data erased'); nav('stats');
  });
}

/* ============================================================
   SHEETS (bottom modals)
   ============================================================ */
const backdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('sheet');
function openSheet(html){ sheetEl.innerHTML = '<div class="grab"></div>'+html; backdrop.classList.add('open'); }
function closeSheet(){ backdrop.classList.remove('open'); }
backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeSheet(); });

function openAccountSheet(editId){
  const a = editId ? acct(editId) : null;
  openSheet(`
    <h3>${a?'Edit account':'New account'}</h3>
    <p class="desc">${a?'Rename or adjust the starting balance.':'Give it a name and its starting balance — everything else builds from there.'}</p>
    <div class="field">${I.wallet}<input id="sh-name" placeholder="Account name (e.g. FTMO 100k)" value="${a?esc(a.name):''}" maxlength="30"></div>
    <div class="field"><span style="font-weight:700;color:var(--ink-dark-dim)">$</span><input id="sh-bal" type="text" inputmode="decimal" placeholder="Starting balance" value="${a?a.startingBalance:''}"></div>
    <button class="btn-primary" id="sh-save" style="margin-top:8px">${I.check}${a?'Save changes':'Create account'}</button>
  `);
  document.getElementById('sh-bal').addEventListener('input',e=> e.target.value=e.target.value.replace(/[^0-9.]/g,''));
  document.getElementById('sh-save').onclick = ()=>{
    const name = document.getElementById('sh-name').value.trim();
    const bal = parseFloat(document.getElementById('sh-bal').value)||0;
    if(!name) return toast('Enter a name');
    if(a){ a.name=name; a.startingBalance=bal; toast('Account updated'); }
    else{
      const acc = {id:uid(), name, startingBalance:bal, createdAt:Date.now()};
      S.accounts.push(acc);
      if(!S.settings.defaultAccountId) S.settings.defaultAccountId = acc.id;
      toast('Account created');
    }
    save(); closeSheet(); render();
  };
  setTimeout(()=>document.getElementById('sh-name').focus(),100);
}

function openTxnSheet(aid, kind){
  const a = acct(aid); if(!a) return;
  const isDep = kind==='deposit';
  openSheet(`
    <h3>${isDep?'Deposit':'Withdraw'} — ${esc(a.name)}</h3>
    <p class="desc">Adjusts your account balance without affecting trade stats. Current balance: <b>${money(balance(aid))}</b></p>
    <div class="field"><span style="font-weight:700;color:var(--ink-dark-dim)">$</span><input id="sh-amt" type="text" inputmode="decimal" placeholder="Amount"></div>
    <div class="field">${I.cal}<input id="sh-date" type="date" value="${todayISO()}" max="${todayISO()}"></div>
    <button class="btn-primary" id="sh-save" style="margin-top:8px">${I.check}Confirm ${isDep?'deposit':'withdrawal'}</button>
  `);
  document.getElementById('sh-amt').addEventListener('input',e=> e.target.value=e.target.value.replace(/[^0-9.]/g,''));
  document.getElementById('sh-save').onclick = ()=>{
    const amt = parseFloat(document.getElementById('sh-amt').value);
    if(!amt || amt<=0) return toast('Enter an amount');
    S.txns.push({id:uid(), accountId:aid, amount: isDep?amt:-amt, kind, date:document.getElementById('sh-date').value||todayISO(), createdAt:Date.now()});
    save(); closeSheet(); toast((isDep?'Deposited ':'Withdrew ')+money(amt)); render();
  };
  setTimeout(()=>document.getElementById('sh-amt').focus(),100);
}

function openAssetSheet(onDone){
  openSheet(`
    <h3>New asset</h3>
    <p class="desc">Add a symbol you trade — e.g. XAUUSD, SPX500, ETHUSD.</p>
    <div class="field">${I.hash}<input id="sh-sym" placeholder="Symbol" maxlength="15" style="text-transform:uppercase"></div>
    <button class="btn-primary" id="sh-save" style="margin-top:8px">${I.check}Add asset</button>
  `);
  document.getElementById('sh-save').onclick = ()=>{
    const sym = document.getElementById('sh-sym').value.trim().toUpperCase();
    if(!sym) return toast('Enter a symbol');
    if(!S.assets.includes(sym)) S.assets.push(sym);
    if(!S.settings.defaultAsset) S.settings.defaultAsset = sym;
    save(); closeSheet(); toast(sym+' added');
    if(onDone) onDone(sym);
  };
  setTimeout(()=>document.getElementById('sh-sym').focus(),100);
}

function confirmSheet(title, desc, onYes){
  openSheet(`
    <h3>${esc(title)}</h3>
    <p class="desc">${esc(desc)}</p>
    <div class="row-btns">
      <button class="btn-soft" id="sh-no" style="background:#fff">Cancel</button>
      <button class="btn-soft" id="sh-yes" style="background:var(--red-deep);color:#fff">Delete</button>
    </div>
  `);
  document.getElementById('sh-no').onclick = closeSheet;
  document.getElementById('sh-yes').onclick = ()=>{ closeSheet(); onYes(); };
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify({app:'tradetrackr',version:1,exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tradetrackr-backup-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup exported');
}
document.getElementById('import-file').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const j = JSON.parse(reader.result);
      const d = j.data && Array.isArray(j.data.accounts) ? j.data : (Array.isArray(j.accounts) ? j : null);
      if(!d) throw 0;
      confirmSheet('Restore this backup?','This replaces everything currently on this device with the backup file.',()=>{
        S = { accounts:d.accounts||[], assets:d.assets||[...DEFAULT_ASSETS], trades:d.trades||[], txns:d.txns||[], settings:d.settings||{defaultAccountId:d.accounts?.[0]?.id||null, defaultAsset:'XAUUSD'} };
        save(); UI.statsAccountId=null; UI.historyFilter='all'; UI.form=null;
        toast('Backup restored'); nav('stats');
      });
      // repurpose confirm button label
      const yes = document.getElementById('sh-yes'); if(yes) yes.textContent='Restore', yes.style.background='var(--navy)';
    }catch(err){ toast('Invalid backup file'); }
    e.target.value='';
  };
  reader.readAsText(file);
});
document.getElementById('btn-export-top').onclick = exportData;

/* ============================================================
   NAV + BOOT
   ============================================================ */
function nav(tab){
  if(tab==='add' && UI.tab!=='add' && UI.form && UI.form.editingId===null){ /* keep draft */ }
  UI.tab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+tab).classList.add('on');
  document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('on', b.dataset.nav===tab));
  render();
  window.scrollTo({top:0});
}
function render(){
  if(UI.tab==='stats') renderStats();
  else if(UI.tab==='add') renderAdd();
  else if(UI.tab==='history') renderHistory();
  else if(UI.tab==='settings') renderSettings();
}
document.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=>{
  const t = b.dataset.nav;
  if(t==='add') UI.form = UI.form && !UI.form.editingId ? UI.form : blankForm();
  nav(t);
}));
document.getElementById('nav-backup').addEventListener('click', exportData);

if('serviceWorker' in navigator){ window.addEventListener('load',()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

nav('stats');
</script>
</body>
</html>
